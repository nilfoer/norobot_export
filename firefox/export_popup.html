<!DOCTYPE html>

<html>
  <head>
    <meta charset="utf-8">
    <meta id="current-url" name="ext-url" content="">
    <link rel=stylesheet type=text/css href="norobot.css">
  </head>

<body>

<div class='pg-wrap'>
<header class="panel-section panel-section-header">
  <div class="text-section-header" id="Title">Get norobot info for:</div>
</header>

<div id="settings-toggle" class="settings-toggle">+ Custom cookie patterns</div>
<div id="settings-section" class="settings-section" style="display:none">
  <label for="custom-patterns">Additional patterns (one per line, * = wildcard):</label>
  <textarea id="custom-patterns" rows="4"
    placeholder="__Secure-mysite_playback&#10;my_custom_cookie&#10;analytics_*"></textarea>
  <div id="settings-status"></div>
  <button id="save-patterns" class="save-btn">Save</button>
</div>

<div id='container'></div>
</div>

<script src="export_popup.js"></script>
</body>

</html>
